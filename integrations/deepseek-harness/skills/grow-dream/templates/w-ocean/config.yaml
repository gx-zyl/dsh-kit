# w-ocean configuration
# The knowledge graph is generated in this directory after each grow-dream run
# Edit this file to customize node/edge types and behavior

# ─── Node types ───
nodeTypes:
  - id: skill
    label: Skill
    description: A scenario-based solution recipe with judgment branches
    icon: 🎯
  - id: rule
    label: Rule
    description: A cross-project generic behavioral constraint
    icon: 📏
  - id: command
    label: Command
    description: A deterministic operation sequence
    icon: ⚡
  - id: agent
    label: Agent
    description: A limited role that runs continuously
    icon: 🤖
  - id: hook
    label: Hook
    description: Automation triggered by git/DSH events
    icon: 🔗
  - id: memory
    label: Memory
    description: Cross-session persistent memory
    icon: 🧠
  - id: doc
    label: Doc
    description: Project documentation
    icon: 📄
  - id: concept
    label: Concept
    description: A domain concept or term
    icon: 💡
  - id: decision
    label: Decision
    description: An architecture decision record
    icon: 🏛️

# ─── Edge types ───
edgeTypes:
  - id: extends
    label: extends
    description: A extends/enhances B
    arrow: "─extends→"
  - id: depends-on
    label: depends-on
    description: A depends on B
    arrow: "─depends→"
  - id: conflicts-with
    label: conflicts-with
    description: A conflicts with / replaces B
    arrow: "─conflicts→"
  - id: generalizes
    label: generalizes
    description: A is the generalized version of B
    arrow: "─generalizes→"
  - id: relates-to
    label: relates-to
    description: A has a generic association with B
    arrow: "─relates→"
  - id: precedes
    label: precedes
    description: A comes before B
    arrow: "─precedes→"
  - id: triggers
    label: triggers
    description: Executing A triggers B
    arrow: "─triggers→"
  - id: refines
    label: refines
    description: A refines the rules of B
    arrow: "─refines→"
  - id: alternative
    label: alternative
    description: A is an alternative to B
    arrow: "─alternative→"

# ─── Automatic deduplication ───
dedup:
  # nodes: deduplicate by id; on the same id update the content and keep the creation time
  nodeById: true
  # edges: deduplicate by (from, to, type)
  edgeByTriple: true
  # automatically create relates-to edges from a node's refs field
  autoEdgesFromRefs: true

# ─── Exclusion patterns (files/directories not included in the graph) ───
exclude:
  - node_modules/
  - .git/
  - __pycache__/
  - .venv/
  - dist/
  - build/
